<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Activity Dashboard{% endblock %}</title>
<style nonce="{{ nonce }}">
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2230;--mute:#667085;--line:#e4e7ec;--accent:#2f6fed;--idle:#c4cad6;--ok:#12a150;--off:#98a2b3}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b202b;--ink:#e8ebf2;--mute:#97a0b3;--line:#2a3140;--accent:#6d9bff;--idle:#4a5266;--ok:#3ddc84;--off:#6b7488}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--line)}
header a{color:var(--ink);text-decoration:none;font-weight:650}
header form{margin:0;display:flex;gap:12px;align-items:center;color:var(--mute);font-size:14px}
main{max-width:1100px;margin:0 auto;padding:24px 16px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--mute);margin:0 0 20px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.card.wide{grid-column:1/-1}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--off);margin-right:6px}
.dot.on{background:var(--ok)}
.mute{color:var(--mute);font-size:13px}
a.name{color:var(--ink);font-weight:650;text-decoration:none}a.name:hover{color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:550;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
button,input{font:inherit}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.link{background:none;color:var(--accent);padding:0}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.chart{position:relative;height:300px}
.err{color:#d92d20;margin:0 0 12px}
.login{max-width:360px;margin:80px auto}
.gap{margin-top:16px}
a.back{color:inherit}
</style>
</head>
<body>
{% if admin %}
<header>
  <a href="{{ url_for('overview') }}">Activity Dashboard</a>
  <form method="post" action="{{ url_for('logout') }}">
    <span>{{ admin }}</span><input type="hidden" name="csrf" value="{{ csrf }}">
    <button class="link" type="submit">Log out</button>
  </form>
</header>
{% endif %}
<main>{% block body %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body>
</html>
