{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<div class="card login">
  <h1>Admin sign in</h1>
  <p class="sub">Activity Logger dashboard</p>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <p><input name="username" placeholder="Username" autocomplete="username" required autofocus></p>
    <p><input name="password" type="password" placeholder="Password" autocomplete="current-password" required></p>
    <button type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
